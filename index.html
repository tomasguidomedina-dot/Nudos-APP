<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUDOS — ISSRC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F4F2;
    --surface:#FFFFFF;
    --surface-2:#EAEAE6;
    --text:#101012;
    --text-dim:#6B6B6E;
    --accent:#FF4E1F;
    --accent-2:#7CC142;
    --danger:#E13B2B;
    --line:#D8D8D3;
    --ring-track:#DEDED8;
    --font-display:'Oswald', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0A0A0B;
      --surface:#151517;
      --surface-2:#1E1F21;
      --text:#F5F5F2;
      --text-dim:#8E8E93;
      --accent:#FF5A1F;
      --accent-2:#B8FF3D;
      --danger:#FF4B3E;
      --line:#28292B;
      --ring-track:#242527;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0B;
    --surface:#151517;
    --surface-2:#1E1F21;
    --text:#F5F5F2;
    --text-dim:#8E8E93;
    --accent:#FF5A1F;
    --accent-2:#B8FF3D;
    --danger:#FF4B3E;
    --line:#28292B;
    --ring-track:#242527;
  }

  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{
    margin:0;
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:1120px;
    margin:0 auto;
    padding:20px 18px 64px;
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 2px 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    letter-spacing:.02em;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
    margin-right:2px;
  }
  .brand .sub{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.12em;
  }
  .stat-chips{display:flex;gap:10px;}
  .chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 14px;
    text-align:center;
    min-width:64px;
  }
  .chip span{
    display:block;
    font-family:var(--font-display);
    font-weight:600;
    font-size:18px;
    line-height:1.1;
  }
  .chip label{
    font-size:9.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.08em;
  }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:16px;
    align-items:start;
  }
  @media (max-width:840px){
    .layout{grid-template-columns:1fr;}
    .stage{order:1;}
    .index{order:2;}
  }

  /* ---------- index / knot list ---------- */
  .index{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .cat-block{}
  .cat-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 2px 8px;
    color:var(--text-dim);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .cat-head svg{width:14px;height:14px;color:var(--accent);flex-shrink:0;}
  .knot-row{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:11px 12px;
    margin-bottom:5px;
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid transparent;
    border-radius:10px;
    cursor:pointer;
    text-align:left;
    font-family:var(--font-body);
    color:var(--text);
  }
  .knot-row .ic{
    width:18px;height:18px;flex-shrink:0;color:var(--text-dim);
  }
  .knot-row .nm{
    flex:1;
    font-size:13px;
    font-weight:500;
    line-height:1.3;
  }
  .knot-row .tg{
    font-family:var(--font-display);
    font-size:12px;
    font-weight:500;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .knot-row .done{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent-2);
    flex-shrink:0;
  }
  .knot-row:hover{border-color:var(--accent);}
  .knot-row.active{
    background:var(--text);
    border-color:var(--text);
    border-left-color:var(--accent);
  }
  .knot-row.active .nm,.knot-row.active .tg{color:var(--bg);}
  .knot-row.active .ic{color:var(--accent);}

  /* ---------- stage / timer panel ---------- */
  .stage{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 24px 24px;
    position:relative;
    overflow:hidden;
    min-height:480px;
    display:flex;
    flex-direction:column;
  }
  .watermark{
    position:absolute;
    right:-30px;
    bottom:-30px;
    width:220px;
    height:220px;
    color:var(--surface-2);
    opacity:.6;
    pointer-events:none;
  }

  .empty-note{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    max-width:30ch;
    line-height:1.6;
    position:relative;
  }
  .empty-note svg{width:40px;height:40px;color:var(--line);margin-bottom:14px;}

  .stage-active{display:none;flex-direction:column;flex:1;position:relative;}

  .p-cat{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
  }
  .p-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(22px,3vw,28px);
    margin:0 0 4px;
    line-height:1.15;
  }
  .p-target{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:8px;
  }
  .p-target b{color:var(--text);font-weight:600;}

  .camilla-toggle{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    cursor:pointer;
    user-select:none;
    width:fit-content;
  }
  .camilla-toggle input{accent-color:var(--accent);}

  .ring-wrap{
    position:relative;
    width:min(280px,72vw);
    height:min(280px,72vw);
    margin:14px auto 8px;
  }
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:10;}
  .ring-fill{
    fill:none;
    stroke:var(--accent-2);
    stroke-width:10;
    stroke-linecap:round;
    transition:stroke-dashoffset .12s linear, stroke .2s ease;
  }
  .ring-fill.over{stroke:var(--danger);}
  .ring-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .ring-center .clock{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(38px,7vw,52px);
    font-variant-numeric:tabular-nums;
    line-height:1;
    letter-spacing:.01em;
  }
  .ring-center .count{
    font-family:var(--font-display);
    font-weight:700;
    font-size:96px;
    color:var(--accent);
    line-height:1;
  }
  .ring-center .status{
    font-size:11px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:6px;
  }
  .ring-center .status.ok{color:var(--accent-2);}
  .ring-center .status.over{color:var(--danger);}

  .controls{
    display:flex;
    gap:8px;
    margin-top:auto;
    padding-top:16px;
  }
  button.act{
    flex:1;
    font-family:var(--font-display);
    font-weight:600;
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:14px 10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--text);
    border-radius:12px;
    cursor:pointer;
  }
  button.act.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#0A0A0B;
    flex:2;
  }
  button.act:disabled{opacity:.35;cursor:default;}
  button.act:not(:disabled):hover{border-color:var(--accent);}
  button.act.primary:not(:disabled):hover{filter:brightness(1.08);}

  .seq-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    font-size:11.5px;
    color:var(--text-dim);
  }
  .seq-strip button{
    background:none;border:none;
    color:var(--accent);
    font-family:var(--font-body);
    font-weight:600;
    font-size:11.5px;
    cursor:pointer;
    padding:0;
  }

  /* ---------- log ---------- */
  .log-section{margin-top:22px;}
  .log-section h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:12px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:0 0 10px;
    padding:0 2px;
  }
  .log-list{display:flex;flex-direction:column;gap:6px;}
  .log-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
  }
  .log-row .lr-name{flex:1;font-weight:500;}
  .log-row .lr-cat{color:var(--text-dim);font-size:11px;display:none;}
  @media (min-width:640px){.log-row .lr-cat{display:block;width:180px;}}
  .log-row .lr-time{
    font-family:var(--font-display);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    width:70px;
    text-align:right;
  }
  .log-row .lr-tag{
    font-size:10px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .lr-tag.ok{background:rgba(124,193,66,.15);color:var(--accent-2);}
  .lr-tag.over{background:rgba(225,59,43,.15);color:var(--danger);}
  .log-empty{color:var(--text-dim);font-size:13px;padding:10px 2px;}
  .clear-log{
    background:none;border:none;color:var(--text-dim);
    font-size:11.5px;cursor:pointer;text-decoration:underline;
    padding:0;margin-top:10px;
  }
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <defs>
    <symbol id="ic-anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="5.5" r="2.2"/>
      <path d="M12 7.7V20"/>
      <path d="M6 13a6 6 0 0012 0"/>
      <path d="M8.5 6.2L5.5 9M15.5 6.2l3 2.8"/>
    </symbol>
    <symbol id="ic-loop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12a3.6 3.6 0 110 7.2A3.6 3.6 0 018 12zM16 12a3.6 3.6 0 110-7.2A3.6 3.6 0 0116 12z"/>
      <path d="M11.6 12h.8"/>
    </symbol>
    <symbol id="ic-biner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2c-3.3 0-5.8 2.8-5.8 6.3V16a3 3 0 003 3h5.6a3 3 0 003-3V9.5c0-3.5-2.5-6.3-5.8-6.3z"/>
      <path d="M12 3.2V6.4"/>
    </symbol>
    <symbol id="ic-knot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 13c2.5-5 6-5 8.5 0s6 5 8.5 0"/>
      <path d="M3.5 9c2.5 5 6 5 8.5 0s6-5 8.5 0"/>
    </symbol>
    <symbol id="ic-climb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13" cy="4.6" r="1.7"/>
      <path d="M13 7.4v5.2M13 9.6l-4 2.6M13 9.6l5-1.8M13 12.6l-3.4 6.8M13 12.6l4 5.4"/>
    </symbol>
    <symbol id="ic-mountain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 19L8 9l3.5 5.2L14 10l7.5 9H2.5z"/>
      <path d="M14 10l1.6-2.4 1 1.5"/>
    </symbol>
    <symbol id="ic-rope-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12c0-3.3 2.7-6 6-6h4c3.3 0 6 2.7 6 6s-2.7 6-6 6H8"/>
      <path d="M8 18l-2-2 2-2"/>
    </symbol>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>NUDOS <span class="sub">ISSRC</span></div>
    <div class="stat-chips">
      <div class="chip"><span id="stat-attempts">0</span><label>Intentos</label></div>
      <div class="chip"><span id="stat-pass">0%</span><label>En tiempo</label></div>
    </div>
  </header>

  <div class="layout">
    <nav class="index" id="index"></nav>

    <section class="stage">
      <svg class="watermark" viewBox="0 0 24 24"><use href="#ic-mountain"/></svg>

      <div class="empty-note" id="panel-empty">
        <svg viewBox="0 0 24 24"><use href="#ic-rope-empty"/></svg>
        <div>Elegí un nudo de la lista para cronometrar, o arrancá la secuencia desde el primero.</div>
      </div>

      <div class="stage-active" id="panel-active">
        <div class="p-cat" id="p-cat-wrap"><svg width="13" height="13"><use id="p-cat-icon" href="#ic-anchor"/></svg><span id="p-cat"></span></div>
        <h2 class="p-name" id="p-name"></h2>
        <div class="p-target">Referencia: <b id="p-target"></b></div>

        <label class="camilla-toggle" id="camilla-wrap" style="display:none;">
          <input type="checkbox" id="camilla-check">
          + camilla (agrega 13 min)
        </label>

        <div class="ring-wrap">
          <svg viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="88"/>
            <circle class="ring-fill" id="ring-fill" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="553"/>
          </svg>
          <div class="ring-center">
            <div class="count" id="count-el" style="display:none;">3</div>
            <div class="clock" id="clock">00:00.0</div>
            <div class="status" id="status">Listo</div>
          </div>
        </div>

        <div class="controls">
          <button class="act primary" id="btn-start">Iniciar</button>
          <button class="act" id="btn-stop" disabled>Marcar</button>
          <button class="act" id="btn-reset">Reset</button>
        </div>

        <div class="seq-strip">
          <span id="seq-position"></span>
          <button id="btn-next">Siguiente →</button>
        </div>
      </div>
    </section>
  </div>

  <div class="log-section">
    <h3>Registro de la sesión</h3>
    <div class="log-list" id="log-list"></div>
    <div class="log-empty" id="log-empty">Todavía no registraste ningún intento.</div>
    <button class="clear-log" id="btn-clear" style="display:none;">Borrar registro</button>
  </div>
</div>

<script>
(function(){
  const DATA = [
    ["NUDOS DE ENCORDAMIENTO O ANCLAJE", "ic-anchor", [
      ["Gaza o Gaza Simple", 10],
      ["Ocho por Seno", 10],
      ["Ocho Aplicado", 30],
      ["As de Guía", 15],
      ["As de Guía Cliente", 20],
      ["Mariposa", 10],
      ["Ballestrinque", 10],
      ["Ballestrinque Aplicado", 10],
    ]],
    ["NUDOS DE UNIÓN", "ic-loop", [
      ["Nudo de Cinta (Plana)", 30],
      ["Llano", 10],
      ["Cola de Vaca Simple", 5],
      ["Cola de Vaca Doble", 10],
      ["Cola de Vaca o EDK (Rapel — 60 cm de chicote)", 10],
      ["Pescador Doble", 20],
    ]],
    ["NUDOS AUTOBLOQUEANTES", "ic-biner", [
      ["Prusik", 30],
      ["Machard (Unidireccional / Bidireccional)", 15],
    ]],
    ["NUDOS ESPECIALES", "ic-knot", [
      ["Dinámico (UIAA)", 10],
      ["Mula — Doble Mula (Bloqueo con mosq.)", 15],
    ]],
    ["MANIOBRAS TÉCNICAS", "ic-climb", [
      ["Arnés de Contingencia", 30],
      ["Plegado en Simple — cuerda de 30 m", 90, "camilla"],
      ["Camilla", 13*60],
    ]],
  ];

  const KNOTS = [];
  DATA.forEach(([cat, icon, items]) => {
    items.forEach(([name, target, note]) => {
      KNOTS.push({id: KNOTS.length, cat, icon, name, target, note: note || null});
    });
  });

  const $ = (id) => document.getElementById(id);
  const indexEl = $('index');
  const panelEmpty = $('panel-empty');
  const panelActive = $('panel-active');
  const clockEl = $('clock');
  const countEl = $('count-el');
  const statusEl = $('status');
  const btnStart = $('btn-start');
  const btnStop = $('btn-stop');
  const btnReset = $('btn-reset');
  const btnNext = $('btn-next');
  const camillaWrap = $('camilla-wrap');
  const camillaCheck = $('camilla-check');
  const seqPos = $('seq-position');
  const ringFill = $('ring-fill');
  const RING_CIRC = 2 * Math.PI * 88;

  let activeId = null;
  let running = false;
  let startTs = 0;
  let elapsedMs = 0;
  let rafId = null;
  let attempted = new Set();
  let countdownIv = null;

  let log = [];
  try {
    const raw = localStorage.getItem('nudos-log-v2');
    if (raw) log = JSON.parse(raw);
  } catch(e){ log = []; }
  try { log.forEach(e => { if (typeof e.knotId === 'number') attempted.add(e.knotId); }); } catch(e){}

  function saveLog(){
    try { localStorage.setItem('nudos-log-v2', JSON.stringify(log)); } catch(e){}
  }

  // ---- sound ----
  let audioCtx = null;
  function beep(freq, dur, type){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      g.gain.value = 0.16;
      osc.connect(g); g.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.start(now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.stop(now + dur + 0.03);
    }catch(e){}
  }

  function fmtTarget(sec){
    if (sec >= 60){
      const m = Math.floor(sec/60), s = sec%60;
      return s ? `${m} min ${s}s` : `${m} min`;
    }
    return `${sec}s`;
  }

  function currentTargetSeconds(knot){
    let t = knot.target;
    if (knot.note === 'camilla' && camillaCheck.checked) t += 13*60;
    return t;
  }

  function renderIndex(){
    indexEl.innerHTML = '';
    DATA.forEach(([cat, icon, items]) => {
      const block = document.createElement('div');
      block.className = 'cat-block';
      const head = document.createElement('div');
      head.className = 'cat-head';
      head.innerHTML = `<svg><use href="#${icon}"/></svg>${cat}`;
      block.appendChild(head);
      items.forEach(([name]) => {
        const knot = KNOTS.find(k => k.cat === cat && k.name === name);
        const row = document.createElement('button');
        row.className = 'knot-row' + (knot.id === activeId ? ' active' : '');
        row.innerHTML = `
          <svg class="ic"><use href="#${icon}"/></svg>
          <span class="nm">${name}</span>
          <span class="tg">${fmtTarget(knot.target)}</span>
          ${attempted.has(knot.id) ? '<span class="done"></span>' : ''}
        `;
        row.addEventListener('click', () => selectKnot(knot.id));
        block.appendChild(row);
      });
      indexEl.appendChild(block);
    });
  }

  function selectKnot(id){
    clearCountdown();
    stopClockLoop();
    running = false;
    elapsedMs = 0;
    activeId = id;
    const knot = KNOTS[id];
    panelEmpty.style.display = 'none';
    panelActive.style.display = 'flex';
    $('p-cat').textContent = knot.cat;
    $('p-cat-icon').setAttribute('href', '#' + knot.icon);
    $('p-name').textContent = knot.name;
    camillaCheck.checked = false;
    camillaWrap.style.display = knot.note === 'camilla' ? 'inline-flex' : 'none';
    updateTargetLine();
    resetRingAndClock();
    btnStart.disabled = false;
    btnStop.disabled = true;
    const idx = KNOTS.findIndex(k => k.id === id);
    seqPos.textContent = `Nudo ${idx+1} de ${KNOTS.length}`;
    renderIndex();
  }

  function updateTargetLine(){
    const knot = KNOTS[activeId];
    $('p-target').textContent = fmtTarget(currentTargetSeconds(knot));
  }
  camillaCheck.addEventListener('change', updateTargetLine);

  function resetRingAndClock(){
    countEl.style.display = 'none';
    clockEl.style.display = 'block';
    clockEl.textContent = '00:00.0';
    statusEl.textContent = 'Listo';
    statusEl.className = 'status';
    ringFill.setAttribute('stroke-dashoffset', RING_CIRC);
    ringFill.classList.remove('over');
  }

  function fmtClock(ms){
    const total = ms/1000;
    const m = Math.floor(total/60);
    const s = total - m*60;
    return `${String(m).padStart(2,'0')}:${s.toFixed(1).padStart(4,'0')}`;
  }

  function tick(){
    if (!running) return;
    const now = performance.now();
    const ms = elapsedMs + (now - startTs);
    clockEl.textContent = fmtClock(ms);
    const knot = KNOTS[activeId];
    const targetMs = currentTargetSeconds(knot) * 1000;
    const frac = Math.min(ms / targetMs, 1);
    ringFill.setAttribute('stroke-dashoffset', RING_CIRC * (1 - frac));
    const over = ms > targetMs;
    ringFill.classList.toggle('over', over);
    statusEl.textContent = over ? 'Pasado' : 'En tiempo';
    statusEl.className = 'status ' + (over ? 'over' : 'ok');
    rafId = requestAnimationFrame(tick);
  }

  function stopClockLoop(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  function clearCountdown(){
    if (countdownIv) clearInterval(countdownIv);
    countdownIv = null;
    countEl.style.display = 'none';
    clockEl.style.display = 'block';
  }

  btnStart.addEventListener('click', () => {
    if (activeId === null || running || countdownIv) return;
    btnStart.disabled = true;
    btnStop.disabled = true;
    btnReset.disabled = true;
    camillaCheck.disabled = true;
    clockEl.style.display = 'none';
    countEl.style.display = 'block';
    let n = 3;
    countEl.textContent = n;
    statusEl.textContent = 'Preparate';
    statusEl.className = 'status';
    beep(520, 0.1, 'square');
    countdownIv = setInterval(() => {
      n -= 1;
      if (n > 0){
        countEl.textContent = n;
        beep(520, 0.1, 'square');
      } else {
        clearInterval(countdownIv);
        countdownIv = null;
        countEl.style.display = 'none';
        clockEl.style.display = 'block';
        statusEl.textContent = 'En tiempo';
        statusEl.className = 'status ok';
        beep(880, 0.22, 'square');
        btnReset.disabled = false;
        running = true;
        startTs = performance.now();
        btnStop.disabled = false;
        tick();
      }
    }, 1000);
  });

  btnStop.addEventListener('click', () => {
    if (!running) return;
    running = false;
    stopClockLoop();
    elapsedMs = elapsedMs + (performance.now() - startTs);
    const knot = KNOTS[activeId];
    const targetMs = currentTargetSeconds(knot) * 1000;
    const diffSec = (elapsedMs - targetMs) / 1000;
    const isOk = elapsedMs <= targetMs;
    ringFill.classList.toggle('over', !isOk);
    statusEl.textContent = isOk ? `OK · sobraron ${Math.abs(diffSec).toFixed(1)}s` : `+${diffSec.toFixed(1)}s`;
    statusEl.className = 'status ' + (isOk ? 'ok' : 'over');
    btnStart.disabled = false;
    btnStop.disabled = true;
    beep(isOk ? 700 : 260, 0.18, isOk ? 'sine' : 'sawtooth');

    log.unshift({
      knotId: knot.id, name: knot.name, cat: knot.cat,
      timeMs: elapsedMs, targetSec: currentTargetSeconds(knot),
      ok: isOk, ts: Date.now()
    });
    attempted.add(knot.id);
    saveLog();
    renderIndex();
    renderLog();
    renderStats();
  });

  btnReset.addEventListener('click', () => {
    clearCountdown();
    running = false;
    stopClockLoop();
    elapsedMs = 0;
    resetRingAndClock();
    btnStart.disabled = false;
    btnStop.disabled = true;
    camillaCheck.disabled = false;
  });

  btnNext.addEventListener('click', () => {
    const idx = KNOTS.findIndex(k => k.id === activeId);
    const nextIdx = (idx + 1) % KNOTS.length;
    selectKnot(KNOTS[nextIdx].id);
  });

  function renderLog(){
    const list = $('log-list');
    const empty = $('log-empty');
    const clearBtn = $('btn-clear');
    if (!log.length){
      list.innerHTML = '';
      empty.style.display = 'block';
      clearBtn.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    clearBtn.style.display = 'inline-block';
    list.innerHTML = '';
    log.slice(0, 60).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <span class="lr-name">${entry.name}</span>
        <span class="lr-cat">${entry.cat}</span>
        <span class="lr-time">${fmtClock(entry.timeMs)}</span>
        <span class="lr-tag ${entry.ok ? 'ok' : 'over'}">${entry.ok ? 'OK' : 'Excedido'}</span>
      `;
      list.appendChild(row);
    });
  }

  $('btn-clear').addEventListener('click', () => {
    log = [];
    attempted = new Set();
    saveLog();
    renderLog();
    renderStats();
    renderIndex();
  });

  function renderStats(){
    $('stat-attempts').textContent = log.length;
    const okCount = log.filter(e => e.ok).length;
    $('stat-pass').textContent = log.length ? Math.round(okCount/log.length*100) + '%' : '0%';
  }

  renderIndex();
  renderLog();
  renderStats();
})();
</script>
</body>
</html>
